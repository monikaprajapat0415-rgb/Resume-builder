# Prime Resume AI - server-rendered public pages (GEO / SEO phase 2)
# Add these inside the server { } block for primeresumeai.com, ABOVE the generic "location / { try_files ... }" block,
# then:  sudo nginx -t && sudo systemctl reload nginx
# Why: AI crawlers mostly do not run JavaScript. Node returns real HTML (title, text, FAQ, JSON-LD) for these paths;
# without this, nginx serves the empty app shell and crawlers see nothing.
# Use the same proxy_pass target as your existing /api or blog location (127.0.0.1:PORT of pm2 "project-backend").

location = / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/(features|features/ats-checker|cv-builder|resume-job-description-matcher|templates|templates/[^/]+|hire|products/image-enhancer)/?$ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Note: Node serves the built client's index.html for these paths too (with the server HTML injected),
# so the app still loads and hydrates normally for people.
