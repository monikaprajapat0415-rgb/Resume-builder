# Prime Resume AI - send www and http to https://primeresumeai.com (one address per page, so Google sees no duplicates).
# Add as its own server block (keep your existing certificate lines; the www name must be on the certificate), then:
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen 443 ssl;
    server_name www.primeresumeai.com;
    # reuse the same ssl_certificate and ssl_certificate_key lines as your main server block
    return 301 https://primeresumeai.com$request_uri;
}
