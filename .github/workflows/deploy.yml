name: Build & Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install & build client
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Install server deps and syntax-check entry
        working-directory: server
        run: |
          npm ci --omit=dev
          node --check server.js

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build and restart on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /var/www/Resume-builder

          PREV=$(git rev-parse HEAD)
          echo "Current commit: $PREV"
          git fetch origin main
          git pull --ff-only origin main
          NEW=$(git rev-parse HEAD)
          echo "Deploying commit: $NEW"

          build_and_restart () {
            (cd server && npm ci --omit=dev)
            (cd client && npm ci && npm run build)
            pm2 restart project-backend --update-env
          }

          healthy () {
            for i in $(seq 1 15); do
              if curl -fsS -m 5 http://127.0.0.1:3000/api/health >/dev/null; then return 0; fi
              sleep 2
            done
            return 1
          }

          build_and_restart
          if healthy; then
            echo "Health check passed on $NEW"
          else
            echo "Health check FAILED, rolling back to $PREV"
            git reset --hard "$PREV"
            build_and_restart
            healthy && echo "Rolled back OK" || echo "Rollback also unhealthy"
            exit 1
          fi
          REMOTE

      - name: Check the live site
        run: |
          set -e
          curl -fsS -m 15 https://api.primeresumeai.com/api/health
          echo
          curl -fsS -m 15 -o /dev/null -w "site: %{http_code}\n" https://primeresumeai.com/
          curl -fsS -m 15 -o /dev/null -w "sitemap: %{http_code}\n" https://primeresumeai.com/sitemap.xml
