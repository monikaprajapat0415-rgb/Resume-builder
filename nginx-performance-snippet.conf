# Speed settings for primeresumeai.com. Add to the server { } block (443) of /etc/nginx/sites-enabled/primeresumeai.com.conf,
# then:  sudo nginx -t && sudo systemctl reload nginx
# 1) Compress text files (usually 3x smaller). If your nginx.conf already has "gzip on;" you can skip the first lines.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml application/wasm;

# 2) Built files in /assets have a hash in their name, so they can be cached for a year.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# 3) index.html must never be cached for long, so a new deploy shows up at once.
location = /index.html {
    add_header Cache-Control "no-cache";
}
