# The same system as separate containers. NOT run in this course.
services:
  gateway:
    build: ./gateway
    ports: ["3000:3000"]
    environment:
      USERS_URL: http://users:3001
      ORDERS_URL: http://orders:3002
      JWT_SECRET: ${JWT_SECRET}
    depends_on: [users, orders]

  users:
    build: ./users                    # no ports: only the gateway can reach it
    environment:
      MONGODB_URI: mongodb://users-db:27017/users
    depends_on: [users-db]

  orders:
    build: ./orders
    environment:
      USERS_URL: http://users:3001
      REDIS_HOST: redis
      MONGODB_URI: mongodb://orders-db:27017/orders
    depends_on: [orders-db, redis]

  notifications:
    build: ./notifications
    environment:
      REDIS_HOST: redis
    depends_on: [redis]

  users-db:
    image: mongo:7
  orders-db:
    image: mongo:7
  redis:
    image: redis:7-alpine
