# /etc/nginx/sites-available/api.example.com
# Replace api.example.com with your domain. Certbot adds the HTTPS parts for you.
upstream node_api {
    server 127.0.0.1:3000;      # add more lines for more copies of the app
    keepalive 16;
}

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 5m;    # matches the upload limit in the app

    location / {
        proxy_pass http://node_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # needed for WebSockets and Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
