# Image enhancer (/products/image-enhancer) uploads pictures of up to 15 MB and can take up to about 30 seconds.
# nginx refuses uploads over 1 MB by default, and closes slow requests after 60 s, so raise both for the API.
# Add inside the server { } block of /etc/nginx/sites-enabled/api.primeresumeai.com.conf (the block with proxy_pass to port 3000),
# then:  sudo nginx -t && sudo systemctl reload nginx
client_max_body_size 20m;
proxy_read_timeout 180s;
proxy_send_timeout 180s;

# If the browser calls the API on the same domain instead (VITE_BASE_URL empty), put the same three lines in a
# location /api/ { proxy_pass http://127.0.0.1:3000; ... } block of primeresumeai.com.conf.
